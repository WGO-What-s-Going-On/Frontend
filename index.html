<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치·홈 바 영역까지 화면을 쓰고, 안전 영역은 CSS(safe-area.css)에서 비운다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 홈 화면에 추가(PWA): 주소창 없이 앱처럼 열리고, iOS는 이 상태에서만 웹 푸시를 받는다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WGO" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>What's Going On?</title>
    <script>
      // 첫 화면이 그려지기 전에 화면 모드를 적용한다. 기본은 라이트, 마이 > 설정에서 다크를 고른 경우만 다크
      try {
        var mode = JSON.parse(localStorage.getItem('wgo-mockup-state-v1') || '{}').themeMode
        document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
